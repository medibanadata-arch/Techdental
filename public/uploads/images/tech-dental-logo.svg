<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 156 50" width="156" height="50" fill="none">
  <defs>
    <style>
      .brand-tech {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 23px;
        font-weight: 900;
        fill: #800038;
        letter-spacing: -0.2px;
      }
      .brand-dental {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-size: 18px;
        font-weight: 900;
        fill: #111111;
        letter-spacing: 0.4px;
      }
    </style>
  </defs>
  <!-- Realistic Tooth Veneer Graphic -->
  <image href="data:image/webp;base64," x="0" y="1" width="45" height="48" preserveAspectRatio="xMidYMid meet" />
  
  <!-- Text Brand Name -->
  <text x="50" y="24" class="brand-tech">TECH</text>
  <text x="50" y="44" class="brand-dental">DENTAL</text>
</svg>